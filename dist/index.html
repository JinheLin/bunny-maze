<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f2">
  <meta name="description" content="帮小兔找到胡萝卜！专为孩子和平板设计的触控迷宫游戏，三个难度，滑动探索，快乐通关。">
  <title>兔兔迷宫 · 森林小探险</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script src="maze.js?v=2" defer></script>
  <script src="app.js?v=2" defer></script>
</head>
<body>
  <svg class="svg-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 8a8 8 0 1 0 .2 7M20 3v5h-5"/></symbol>
      <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6m-5 3h4M8 14a7 7 0 1 1 8 0c-1 .8-1 1.5-1 2H9c0-.5 0-1.2-1-2Z"/></symbol>
      <symbol id="i-sound" viewBox="0 0 24 24"><path d="m11 4-6 5H2v6h3l6 5V4Zm4 4a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol>
      <symbol id="i-muted" viewBox="0 0 24 24"><path d="m11 4-6 5H2v6h3l6 5V4Zm5 5 6 6m0-6-6 6"/></symbol>
      <symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m8 0h5v-5"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 2 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1Z"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
      <symbol id="bunny" viewBox="0 0 100 112">
        <ellipse cx="34" cy="29" rx="12" ry="27" transform="rotate(-12 34 29)" fill="#fffdf7" stroke="#dfdace" stroke-width="2"/>
        <ellipse cx="67" cy="27" rx="12" ry="26" transform="rotate(12 67 27)" fill="#fffdf7" stroke="#dfdace" stroke-width="2"/>
        <ellipse cx="34" cy="28" rx="5" ry="17" transform="rotate(-12 34 28)" fill="#f7bdad"/>
        <ellipse cx="67" cy="27" rx="5" ry="16" transform="rotate(12 67 27)" fill="#f7bdad"/>
        <ellipse cx="50" cy="79" rx="30" ry="29" fill="#f1eee3"/>
        <ellipse cx="50" cy="66" rx="38" ry="31" fill="#fffdf7" stroke="#dfdace" stroke-width="2"/>
        <ellipse cx="27" cy="73" rx="8" ry="5" fill="#f6b8a6" opacity=".7"/><ellipse cx="74" cy="73" rx="8" ry="5" fill="#f6b8a6" opacity=".7"/>
        <ellipse cx="36" cy="63" rx="3" ry="4" fill="#374e42"/><ellipse cx="65" cy="63" rx="3" ry="4" fill="#374e42"/>
        <path d="m47 71 3 3 3-3m-3 3v4m-6-1q6 7 12 0" fill="none" stroke="#9c6b5b" stroke-linecap="round" stroke-width="2.5"/>
        <path d="m30 94 20 9 20-9-4-9H34Z" fill="#e8a45d"/><circle cx="50" cy="98" r="3" fill="#fff5da"/>
        <ellipse cx="29" cy="103" rx="13" ry="7" fill="#fffdf7"/><ellipse cx="71" cy="103" rx="13" ry="7" fill="#fffdf7"/>
      </symbol>
      <symbol id="carrot" viewBox="0 0 64 74">
        <path d="M35 23C20 7 29 0 36 20 37 0 49-1 42 21 58 9 62 18 43 28" fill="#649866"/>
        <path d="M29 22C6 24 14 47 19 68c1 5 4 5 7 1 14-17 32-36 17-44-5-3-9-4-14-3Z" fill="#f4a04d" stroke="#e68a39" stroke-width="2"/>
        <path d="m19 35 10 4m-6 13 9 3m3-26 8 4" stroke="#d97a31" stroke-width="3" stroke-linecap="round"/>
      </symbol>
    </defs>
  </svg>

  <div class="app-shell">
    <header class="app-header">
      <a class="brand" href="#" aria-label="兔兔迷宫首页">
        <span class="brand-icon"><svg><use href="#bunny"/></svg></span>
        <span>兔兔迷宫<span class="brand-en">BUNNY'S LITTLE ADVENTURE</span></span>
      </a>
      <div class="header-right"><span class="header-note"><span></span> 小小脚步，大大冒险</span>
        <button class="icon-button" id="sound" aria-label="开启声音" aria-pressed="false" title="开启声音"><svg><use href="#i-muted"/></svg></button>
        <button class="icon-button" id="fullscreen" aria-label="进入全屏" title="进入全屏"><svg><use href="#i-expand"/></svg></button>
      </div>
    </header>

    <main>
      <div class="intro">
        <div><div class="eyebrow"><span class="tiny-spark">✳</span> 森林探险日记 <span class="eyebrow-line"></span></div>
          <h1>小兔的胡萝卜<span>大冒险</span><svg class="title-carrot"><use href="#carrot"/></svg></h1>
          <p>转个弯，想一想，帮小兔找到美味的胡萝卜吧！</p>
        </div>
        <div class="achievement" aria-live="polite"><span class="achievement-icon"><svg><use href="#i-star"/></svg></span><span><strong id="wins">0</strong> <span class="win-unit">次</span><small>成功的小探险</small></span></div>
      </div>

      <div class="game-layout">
        <section class="maze-card" aria-label="迷宫游戏">
          <div class="board-header"><div class="adventure-label"><span class="live-dot"></span><span id="adventure-status">探险进行中</span><span class="round-count" id="round">NO. 01</span></div><div class="board-stats"><div class="board-legend"><span class="legend-start"></span> 起点<span class="legend-end"></span> 胡萝卜</div><span id="steps">已走 0 步</span></div></div>
          <div class="board-stage">
            <div id="maze-board" class="maze-board" role="application" tabindex="0" aria-label="迷宫。滑动、点按相邻格子或使用键盘移动小兔。">
              <svg id="maze-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" aria-hidden="true"></svg>
            </div>
          </div>
          <div class="board-footer"><span class="gesture-icon">☝</span><span>滑一滑，或点小兔旁边的一格</span><span class="keyboard-note">电脑也支持方向键</span></div>
        </section>

        <aside class="control-panel">
          <section class="difficulty-panel"><div class="section-heading"><h2>选一个小挑战</h2><span>难度</span></div>
            <div class="difficulty-options" role="group" aria-label="迷宫难度">
              <button class="difficulty active" data-level="easy" aria-pressed="true"><span class="level-symbol">🌱</span><span>轻松<span class="level-caption">8 × 8</span></span><svg class="selected-check"><use href="#i-check"/></svg></button>
              <button class="difficulty" data-level="medium" aria-pressed="false"><span class="level-symbol">🌿</span><span>进阶<span class="level-caption">12 × 12</span></span><svg class="selected-check"><use href="#i-check"/></svg></button>
              <button class="difficulty" data-level="hard" aria-pressed="false"><span class="level-symbol">🌳</span><span>挑战<span class="level-caption">16 × 16</span></span><svg class="selected-check"><use href="#i-check"/></svg></button>
            </div>
          </section>

          <div class="action-buttons"><button id="new-maze" class="primary-button"><svg><use href="#i-refresh"/></svg> 换一张迷宫</button><div class="secondary-actions"><button id="hint"><svg><use href="#i-bulb"/></svg> 给我一点提示</button><button id="restart" aria-label="回到起点"><svg><use href="#i-refresh"/></svg><span>重走</span></button></div></div>

          <div class="encouragement"><span class="encouragement-flower">✿</span><div><strong id="encouragement-title">每一步，都很棒！</strong><p id="encouragement-text">走错也没关系，换个方向试试看。</p></div><svg class="encouragement-carrot"><use href="#carrot"/></svg></div>
        </aside>
      </div>
      <footer class="app-footer"><span>小小探险家，准备好了吗？</span><span>自由探索 <b>·</b> 没有倒计时 <b>·</b> 快乐最重要 <span class="footer-flower">✿</span></span></footer>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <dialog id="success-dialog" aria-labelledby="success-title">
    <div class="confetti" aria-hidden="true"></div><button id="close-success" class="dialog-close" aria-label="关闭通关反馈">×</button>
    <div class="success-art"><svg class="success-bunny"><use href="#bunny"/></svg><svg class="success-carrot"><use href="#carrot"/></svg><span>✦</span></div>
    <div class="success-stars" aria-label="获得三颗探险星星">★ ★ ★</div><h2 id="success-title">找到胡萝卜啦！</h2><p>小兔说：谢谢你，小小探险家！</p><div class="success-stat" id="success-stat"></div><button id="next-adventure" class="primary-button">再来一次探险 <span>→</span></button><button id="replay-maze" class="text-button">这张迷宫再走一次</button>
  </dialog>
</body>
</html>
